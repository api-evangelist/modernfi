aid: modernfi
name: ModernFi
description: >-
  ModernFi operates institution-owned deposit networks for U.S. banks and credit
  unions, giving them infrastructure to grow deposits, extend reciprocal deposit
  insurance beyond standard FDIC/NCUA limits, optimize funding, and deepen
  depositor relationships. Its Digital Banking API (v1) lets member institutions
  programmatically manage deposit accounts, depositors, transaction records and
  sweeps, monthly statements and files, custom rate benchmarks, and pricing
  groups — authenticated with OAuth 2.0 client credentials and pulled into
  treasury, ALCO, risk, and reporting systems. ModernFi is backed by a16z.
