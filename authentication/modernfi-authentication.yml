notes: >-
  The OpenAPI declares a single HTTP bearer scheme named "OAuth", but the
  documented flow is OAuth 2.0 client_credentials. Credentials (Client ID +
  Client Secret) are issued by ModernFi after institution onboarding and
  delivered via SendSafely. A token is minted at
  https://auth.modernfi.com/oauth/token with grant_type=client_credentials and
  an audience of the target API host, then passed as "Authorization: Bearer
  <access_token>". Access is granted at two coarse levels rather than
  fine-grained scopes: read-only (retrieve accounts, depositors, transactions,
  statements) and read+write (full create/modify). Tokens expire in 86400s.
